name: Update dengue data

on:
  schedule:
    # Every 3 hours, so a late or re-issued update is picked up the same day.
    # Off the hour on purpose: GitHub delays or drops scheduled runs when it is
    # busy, and :00 is when it is busiest. On '0 */3' this ran 3-5 times a day,
    # not 8, with gaps of up to 11 hours.
    - cron: '23 */3 * * *'
    # Hourly while DGHS is publishing. The report lands anywhere from about
    # 11:00 to 17:40 UTC (17:00-23:40 Bangladesh time), so this is the window
    # where an hour saved is an hour sooner on readers' phones. A run that
    # finds nothing new commits nothing.
    - cron: '53 10-18 * * *'
  workflow_dispatch:        # lets you trigger a refresh by hand from the Actions tab
  push:
    branches: [main]
    paths:
      - 'scraper/**'
      - 'tests/**'
      - '.github/workflows/update-data.yml'
  pull_request:             # PRs only run the tests; they never scrape or commit
    paths:
      - 'scraper/**'
      - 'tests/**'
      - '.github/workflows/update-data.yml'

permissions:
  contents: write
  issues: write

concurrency:
  group: update-dengue-data-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Parser tests
        run: python -m unittest discover -s tests -v

  scrape:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Scrape DGHS dashboard
        run: python scraper/scrape.py

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --staged --quiet; then
            echo "No change in published figures."
          else
            git commit -m "data: DGHS dengue update $(date -u '+%Y-%m-%d %H:%M UTC')"
            # Someone may have pushed to main while the scrape ran.
            git pull --rebase origin main
            git push
          fi

      # A failing schedule is otherwise silent: the feed just stops updating.
      # Open one issue (not one per run) so the maintainer gets notified.
      - name: Open an issue if the scheduled scrape failed
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Scheduled DGHS scrape is failing"
          if [ -z "$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[].number')" ]; then
            gh issue create --title "$title" --body "The scheduled update failed in run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}.

          The site keeps serving the last good data. Common causes: DGHS changed the page layout (sanity check failed), or the source was unreachable for all retries. Close this issue once a run succeeds again."
          fi
